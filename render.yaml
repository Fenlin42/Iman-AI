# Render Blueprint: one web service with a persistent disk for the SQLite database.
services:
  - type: web
    name: produktwerk
    runtime: docker
    plan: starter
    healthCheckPath: /api/status
    disk:
      name: produktwerk-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: DATA_DIR
        value: /data
