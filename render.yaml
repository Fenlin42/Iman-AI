# Render Blueprint for the free plan.
# Free services have no persistent disk: the server forgets projects on every restart
# (also after it sleeps from inactivity). The app therefore keeps a backup of each
# project in your browser and restores it automatically.
# For server-side persistence switch to a paid plan and add a disk mounted at /data.
services:
  - type: web
    name: produktwerk
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: DATA_DIR
        value: /data
